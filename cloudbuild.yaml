substitutions:
  _REGION: us-central1
  _SERVICE: scholarmind
  _REPO: scholarmind

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      # Private by default: a public URL in front of a Gemini key is a cost liability.
      - --no-allow-unauthenticated
      - --service-account=${_SERVICE}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=NODE_ENV=production,GCS_BUCKET=$PROJECT_ID-scholarmind
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest
      - --min-instances=0
      - --memory=1Gi
      # Ingestion plus generation is slow; the default 5 minutes is the ceiling we need.
      - --timeout=300s
      - --concurrency=80

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
